name: Deploy Equipment Inspection App to Google Apps Script

on:
  push:
    branches:
      - claude/equipment-inspection-app-3glfyc
    paths:
      - 'equipment-inspection-app/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: equipment-inspection-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Write service account credentials
        run: echo "${GCP_SA_KEY}" > creds.json
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Authenticate clasp with service account
        run: clasp login --creds creds.json

      - name: Push to Google Apps Script
        run: clasp push --force

      - name: Clean up credentials
        if: always()
        run: rm -f creds.json
