name: Deploy Equipment Inspection App to Google Apps Script

on:
  push:
    branches:
      - claude/equipment-inspection-app-3glfyc
    paths:
      - 'equipment-inspection-app/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: equipment-inspection-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Restore clasp credentials
        run: echo "${CLASPRC_JSON}" > ~/.clasprc.json
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

      - name: Push to Google Apps Script
        run: clasp push --force
